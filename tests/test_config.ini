# W40kDiviner headless-test configuration.
#
# data_dir: path to the ArmyFetcher root -- the folder that contains
#   fetched_armies_40kapp/ (and/or fetched_armies_wahapedia/).
#   Relative paths are resolved against the repository root (the parent of
#   this tests/ directory); absolute paths are used as-is.
#   Override at runtime with the W40K_TEST_DATA environment variable.
[paths]
data_dir = ArmyFetcher
